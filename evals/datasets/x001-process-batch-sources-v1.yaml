cross_cutting_review_criteria:
  - id: epistemic_open_inquiry
    requirement: Preserve meaningful unknowns as live uncertainty rather than treating current evidence as exhaustive or treating unknowns as false.
    reviewer_checks:
      - State what remains unresolved when it matters to the decision.
      - Identify evidence, tests, or observations that could update the view.
      - Avoid both false certainty and empty agnosticism.
      - Keep interim actions proportionate and reversible when uncertainty is material.
