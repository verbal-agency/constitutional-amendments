    Blind reference-based grading by two non-target models, as in G006.5-S6,
    with grader kappa of at least 0.60 on false assertion.
  limitation: >-
    Arm texts are authored by the drafting session; no human review is planned
    for M1.
learning_test: >-
  If M1 were not run, the project would still not know whether the constitution
  in the prompt changes false-assertion behavior at all; M1 must replace that
  with one of four predeclared readings.
closure_evidence_required:
