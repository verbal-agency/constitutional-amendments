last_decision: >-
  G006-S6 completed an offline closure review and decided proceed to G007.
  Source, registry, exact-replacement, provenance, fixture, and core
  SC-001–SC-009 evidence passed without an attributable blocking regression.
  SC-010-D2 remains a non-blocking diagnostic owned by G010. G007-S1 validated
  the hazard schema and fixtures; G007-S2 drafted HA-01–HA-07 and passed
  offline clause/provenance checks; G007-S3 reviewed all fixtures and boundary
  probes offline, revising HA-04 to require discriminating tests. The next
  decision was whether an offline probe packet was ready for separately
  authorized model execution without over-refusal or under-refusal. G007-S4
  produced and validated a 15-case packet with 10 paired cases and 5 sentinels.
  The first behavioral candidate-versus-base probe now routes to proposed bridge
  goal G006.5; G007 remains responsible for its offline clause and fixture
  contract.
next_action: >-
  Activate the proposed G006.5 bridge. Assemble the provisional candidate from
  the source and replacement manifest, then prepare the separate model and judge
  preflight. Do not run a model call in G007.
upstream_assumptions_to_recheck:
  - SC-010 is a separately reported, non-blocking process diagnostic.
  - The candidate must replace exact source spans rather than append a module.
  - G006 closed on authority/provenance outcomes and attributable SC-001–SC-009 regressions.
  - G007 must consume the G006 authority/provenance interfaces without reopening them absent counterevidence.
  - G007-S1 schema and fixture coverage are validated offline; G007-S2 clause structure and traceability are validated offline; G007-S3 semantic fixture/boundary review is validated offline; behavioral effects remain to be justified.
  - G007 applies the schema through prompt-first constitutional clauses; runtime enforcement is deferred to backlog B001.
downstream_impact:
  - G006-S5N is abandoned; no provider or judge calibration will run for D2 in G006.
  - G006 is complete; G007 is in progress and G007-S1 through G007-S3 are complete.
  - G010 owns separate SC-010 reporting and predeclared human/judge review.
  - G006.5 owns the first provisional candidate-versus-base probe and its
    predeclared judge/measurement contract; G008 and G009 consume that decision.
artifact_budget:
  provisional_replacement_manifest: 1
  fixture_or_probe_manifest: 1
  verification_record: 1
  exception_rule: >-
    Any additional analysis artifact must name the decision that would change
    if it did not exist.
independent_review:
  required: true
  minimum_sample: >-
    Three expected gains, three expected failures or non-gains, and every
    sentinel regression.
  fallback: >-
    If the drafting session also performs review, review is delayed and blind
    to new outputs and the independence limitation is recorded.
learning_test: >-
  If no walking-skeleton bridge existed, the project would still treat offline
  fixture coverage as the main evidence; the bridge must replace that belief
  with observed candidate-versus-base behavior or a recorded assembly or
  measurement blocker.
