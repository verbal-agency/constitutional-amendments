consumer: M3 design decision and G008 start decision
current_slice: none started; M1 contract written, manifest and runner not yet built
closure_mode: behavior-bearing
behavioral_evidence_status: none
last_evidence: framework/G006.5-S6-pressure-verification.md
last_checkpoint_date: 2026-11-13
last_decision: >-
  G006.5 closed by owner-approved amendment
  (framework/G006.5-roadmap-amendment.md). G006.5-S2 to S4 ran the 15-case
  G007-S4 packet and two small follow-ups with same-session labels; the source
  arm passed seven of ten paired cases, so the packet could not discriminate.
  G006.5-S5 (640 outputs, two blind non-target graders) did not support the
  lead that the G005 replacement raises confabulation; its validity gates
  failed and its decision was unresolved. G006.5-S6 (800 outputs, blind
  reference grading, both gates passed) returned no detectable difference
  between the provisional candidate and the source on false assertion (+3.3 and
  +1.0 points). A two-sentence user-turn wrapper moved the same behavior by 7 to
  15 points in both arms. G007 moved to drafted-unverified. A three-goal
  measurement track (M1 lever check, M2 behavior battery, M3 theme attribution)
  now precedes G008.
next_action: >-
  Build the M1 manifest (arm texts for none, short, base+inside, base+end; the
  none envelope; the fixed readings) and its runner offline, reusing the
  G006.5-S6 item list, graders, and analysis. Dry-run for cost, then request the
  owner's approval of a ceiling before any paid call.
upstream_assumptions_to_recheck:
  - SC-010 is a separately reported, non-blocking process diagnostic.
  - The candidate must replace exact source spans rather than append a module.
  - The G006.5-S6 item list, grader prompts, and analysis are reused unchanged; any change makes M1 results non-comparable with S6.
  - The provider alias deepseek-flash still resolves to the model used in G006.5-S6; M1's base-arm regression check tests this.
  - G006.5's independent-review criterion was met by substitution (blind model grading of S5 and S6), not by review of the S2 author labels; no human review exists.
  - The S5 and S6 cases, pressure wrappers, and the roadmap amendment were drafted in one working session; grading was independent, design was not.
downstream_impact:
  - G006.5 is complete with decision no detectable difference.
  - G007 is drafted-unverified; its clauses stand and drafting is paused until M2 supplies a qualified measure.
  - G008 cannot be proposed until the M1 decision is recorded and M2 has closed.
  - M3 runs only if M1 reads that the document drives the behavior; otherwise it becomes a placement study or does not run.
  - If M1 reads weak lever, promoting X001 is the first option put to the owner.
  - G010 adds the M2 battery and a second target model to its inputs; it remains the only official comparison.
