  - evals/manifests/m1-lever-check.json
  - framework/M1-verification.md
stop_condition: >-
  Stop if the item set, arm texts, or readings change after outputs are
  inspected, if the base arm fails its regression check against G006.5-S6, or
  after two execution slices. Do not add arms after seeing results.
